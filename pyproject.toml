[project]
name = "request-defense-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
test = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Print defense verdict logs (decision inputs + conclusion) to the console.
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(name)s %(message)s"
log_format = "%(levelname)s %(name)s %(message)s"
